name: En8 Apple pending-depth validation
'on':
  push:
    branches:
    - release-packaging/31.1.2-en.7-macos
    paths:
    - .github/workflows/en8-platform-packages.yml
    - .github/en8-mainnet/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  macos-cross:
    name: Build macOS ${{ matrix.arch }} from the release source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          profile: ./ci/test/00_setup_env_mac_cross.sh
    env:
      FILE_ENV: ${{ matrix.profile }}
      DANGER_CI_ON_HOST_FOLDERS: 1
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 061dc30c21824155cb4a9c1c5d3bbf13c9ad790e
        persist-credentials: false
        repository: decryp2kanon/sugarchain-en
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "061dc30c21824155cb4a9c1c5d3bbf13c9ad790e"

        test "$(git rev-parse HEAD^{tree})" = "d91caa8495829d24de5b8d47f23e35f98c0b48a2"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"'
    - uses: ./.github/actions/configure-environment
    - uses: ./.github/actions/clear-files
    - uses: ./.github/actions/cache/restore
      with:
        provider: gha
    - name: Restore En.7 branch dependency cache
      id: en7-depends
      if: ${{ github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/release-packaging/31.1.2-en.7-macos'
        }}
      uses: actions/cache/restore@v5
      with:
        path: '${{ env.BASE_CACHE }}

          ${{ env.SOURCES_PATH }}'
        key: en7-arm64-depends-v1-${{ env.DEPENDS_HASH }}
    - name: Restore En.7 branch compiler cache
      id: en7-ccache
      if: ${{ github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/release-packaging/31.1.2-en.7-macos'
        }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: en7-arm64-ccache-v1-${{ env.DEPENDS_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: en7-arm64-ccache-v1-${{ env.DEPENDS_HASH }}-
    - uses: ./.github/actions/configure-docker
      with:
        provider: gha
    - name: Cross-build with the repository's Darwin depends toolchain
      shell: bash
      run: "test \"$(git rev-parse HEAD)\" = 061dc30c21824155cb4a9c1c5d3bbf13c9ad790e\nsource ./ci/test/00_setup_env.sh\n\
        export GOAL=\"install deploy\"\nexport BASE_OUTDIR=\"$BASE_BUILD_DIR/installed\"\nexport BITCOIN_CONFIG=\"\
        \n  -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON\
        \ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_SHARED_LIBS=OFF -DREDUCE_EXPORTS=ON\n  -DBUILD_GUI=ON\
        \ -DENABLE_WALLET=ON -DENABLE_IPC=OFF\n  -DBUILD_TESTS=ON -DBUILD_GUI_TESTS=OFF -DBUILD_BENCH=OFF\
        \ -DBUILD_FUZZ_BINARY=OFF\n  -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON\n  -DINSTALL_MAN=ON\
        \ -DWITH_USDT=OFF\"\n# The container receives its configuration in a line-oriented Docker env\
        \ file.\nexport BITCOIN_CONFIG=\"$(echo \"$BITCOIN_CONFIG\" | xargs)\"\npython3 ./ci/test/02_run_container.py\n\
        \npython3 - \"$BASE_BUILD_DIR/compile_commands.json\" <<'PY'\nimport json\nfrom pathlib import\
        \ Path\nimport shutil\nimport re\nimport shlex\nimport sys\n\ncommands = json.loads(Path(sys.argv[1]).read_text())\n\
        for name in (\"validation.cpp\", \"yespower-opt.c\", \"sha256.c\"):\n    matching = [row for row\
        \ in commands if Path(row[\"file\"]).name == name]\n    if not matching:\n        sys.exit(f\"\
        Missing release translation unit: {name}\")\n    for row in matching:\n        args = row.get(\"\
        arguments\") or shlex.split(row[\"command\"])\n        levels = [arg for arg in args if re.fullmatch(r\"\
        -O([0-9]|s|z|g|fast)?\", arg)]\n        if not levels or levels[-1] != \"-O3\" or not any(arg\
        \ in (\"-flto\", \"-flto=thin\", \"-flto=full\") for arg in args):\n            sys.exit(f\"Expected\
        \ optimized IPO code generation for {name}: {levels}\")\n        if name == \"sha256.c\" and \"\
        yespower-1.0.1\" in row[\"file\"]:\n            object_path = Path(row[\"directory\"]) / args[args.index(\"\
        -o\") + 1]\n            bitcode = object_path.read_bytes()\n            for instruction in (\"\
        sha256h\", \"sha256h2\", \"sha256su0\", \"sha256su1\"):\n                intrinsic = (\"llvm.aarch64.crypto.\"\
        \ + instruction).encode()\n                if intrinsic not in bitcode:\n                    sys.exit(f\"\
        Missing hardware SHA-256 intrinsic in {object_path}: {instruction}\")\n            print(\"Verified\
        \ hardware SHA-256 intrinsics in the cross-built Yespower LTO object\")\n    print(f\"Verified\
        \ Release -O3 and IPO for {name}\")\nPY\n\ntest -x \"$BASE_BUILD_DIR/bin/test_bitcoin\"\n"
    - name: Collect the cross-built GUI and command-line programs
      shell: bash
      run: "mkdir -p transfer/cli/bin transfer/cli/share/man/man1\ncp \"$(cat \"$BASE_BUILD_DIR/macos-archive-path.txt\"\
        )\" transfer/app.zip\npython3 contrib/macdeploy/verify_bundle.py transfer/app.zip \"${{ matrix.arch\
        \ }}\"\nfor exe in sugarchain sugarchaind sugarchain-cli sugarchain-wallet sugarchain-tx sugarchain-util;\
        \ do\n  install -m755 \"$BASE_BUILD_DIR/installed/bin/$exe\" \"transfer/cli/bin/$exe\"\n  install\
        \ -m644 \"doc/man/$exe.1\" \"transfer/cli/share/man/man1/$exe.1\"\ndone\ncp COPYING contrib/debian/copyright\
        \ transfer/cli/\ntar -czf transfer/cli.tar.gz -C transfer cli\ninstall -m755 \"$BASE_BUILD_DIR/bin/test_bitcoin\"\
        \ transfer/test_bitcoin\ngit rev-parse HEAD > transfer/release-source-sha.txt\ngit rev-parse HEAD^{tree}\
        \ > transfer/release-source-tree.txt\n(\n  cd transfer\n  sha256sum app.zip cli.tar.gz test_bitcoin\
        \ release-source-sha.txt release-source-tree.txt > input.sha256\n)\n"
    - uses: actions/upload-artifact@v7
      with:
        name: cross-macos-${{ matrix.arch }}
        path: transfer/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
    - name: Save En.7 branch dependency cache
      if: ${{ github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/release-packaging/31.1.2-en.7-macos'
        && steps.en7-depends.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: '${{ env.BASE_CACHE }}

          ${{ env.SOURCES_PATH }}'
        key: en7-arm64-depends-v1-${{ env.DEPENDS_HASH }}
    - name: Save En.7 branch compiler cache
      if: ${{ github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/release-packaging/31.1.2-en.7-macos'
        && steps.en7-ccache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: en7-arm64-ccache-v1-${{ env.DEPENDS_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
  macos-pack:
    name: Package and run macOS ${{ matrix.arch }}
    needs: macos-cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          runner: macos-15
    env:
      ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 061dc30c21824155cb4a9c1c5d3bbf13c9ad790e
        persist-credentials: false
        repository: decryp2kanon/sugarchain-en
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "061dc30c21824155cb4a9c1c5d3bbf13c9ad790e"

        test "$(git rev-parse HEAD^{tree})" = "d91caa8495829d24de5b8d47f23e35f98c0b48a2"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"'
    - name: Check out the exact release diagnostics overlay
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: release-tools
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: cross-macos-${{ matrix.arch }}
        path: incoming
    - name: Ad-hoc sign and archive the platform binaries
      shell: bash
      run: "set -euo pipefail\ntest \"$(cat incoming/release-source-sha.txt)\" = \"$(git rev-parse HEAD)\"\
        \ntest \"$(cat incoming/release-source-tree.txt)\" = \"$(git rev-parse HEAD^{tree})\"\n(cd incoming\
        \ && shasum -a 256 -c input.sha256)\ntest \"$(uname -m)\" = \"$ARCH\"\nprefix=\"sugarchain-en-31.1.2-macos-$ARCH\"\
        \nmkdir -p staged release\ntar -xzf incoming/cli.tar.gz -C staged\nmv staged/cli \"staged/$prefix-cli\"\
        \nditto -x -k incoming/app.zip staged\napp=\"staged/Sugarchain-Qt.app\"\ncp COPYING contrib/debian/copyright\
        \ \"$app/Contents/Resources/\"\nfor exe in \"staged/$prefix-cli/bin\"/* \"$app/Contents/MacOS/Sugarchain-Qt\"\
        ; do\n  test \"$(lipo -archs \"$exe\")\" = \"$ARCH\"\n  dylibs=$(otool -L \"$exe\" | sed -n '2,$p'\
        \ | awk '{print $1}')\n  test -n \"$dylibs\"\n  if echo \"$dylibs\" | grep -Ev '^(/usr/lib/|/System/Library/)';\
        \ then\n    echo \"::error::Non-system shared library in $exe\"\n    exit 1\n  fi\ndone\nfor exe\
        \ in \"staged/$prefix-cli/bin\"/*; do\n  strip -S \"$exe\"\n  codesign --force --sign - --timestamp=none\
        \ \"$exe\"\ndone\ncodesign --force --sign - --timestamp=none \"$app\"\nditto -c -k --norsrc --keepParent\
        \ \"$app\" \"release/$prefix.zip\"\nCOPYFILE_DISABLE=1 tar -czf \"release/$prefix-cli.tar.gz\"\
        \ -C staged \"$prefix-cli\"\n"
    - name: Run the final signed archives on matching hardware
      shell: bash
      run: "prefix=\"sugarchain-en-31.1.2-macos-$ARCH\"\nmkdir checked\nditto -x -k \"release/$prefix.zip\"\
        \ checked\ntar -xzf \"release/$prefix-cli.tar.gz\" -C checked\npython3 contrib/macdeploy/verify_bundle.py\
        \ \"release/$prefix.zip\" \"$ARCH\"\ncodesign --verify --deep --strict \"checked/Sugarchain-Qt.app\"\
        \nfor exe in \"checked/$prefix-cli/bin\"/*; do codesign --verify --strict \"$exe\"; done\npython3\
        \ .github/ci-native-datadir.py --daemon \"checked/$prefix-cli/bin/sugarchaind\" --gui \"checked/Sugarchain-Qt.app/Contents/MacOS/Sugarchain-Qt\"\
        \ --cli \"checked/$prefix-cli/bin/sugarchain-cli\" --workdir \"$RUNNER_TEMP/en-native-datadir\"\
        \npython3 - <<'PY'\nimport os, runpy, subprocess, sys\nfrom pathlib import Path\nverify = Path(\"\
        contrib/macdeploy\").resolve()\nsys.path.insert(0, str(verify))\nhelpers = runpy.run_path(str(verify\
        \ / \"verify-native.py\"))\nwork = Path(os.environ[\"RUNNER_TEMP\"]) / \"en-release-runtime\"\n\
        work.mkdir()\nroot = Path(\"checked\").resolve()\nbindir = next(root.glob(\"*-cli/bin\"))\nfor\
        \ program in sorted(bindir.iterdir()):\n    helpers[\"check_version\"](program, work / \"versions\"\
        )\ndaemon = bindir / \"sugarchaind\"\ngui = root / \"Sugarchain-Qt.app/Contents/MacOS/Sugarchain-Qt\"\
        \nfor program, chain in ((daemon, \"main\"), (gui, \"regtest\")):\n    folder = work / chain\n\
        \    with helpers[\"Node\"](program, folder, chain, gui=program == gui) as node:\n        info\
        \ = helpers[\"check_chain\"](node, chain)\n        assert info[\"blocks\"] == 0\n        out =\
        \ subprocess.check_output([str(bindir / \"sugarchain-cli\"), f\"-datadir={folder}\",\n       \
        \                                f\"-chain={chain}\", f\"-rpcport={node.port}\", \"getblockcount\"\
        ], text=True)\n        assert out.strip() == \"0\"\n        node.rpc(\"createwallet\", \"release-test\"\
        )\n        address = node.rpc(\"getnewaddress\", \"\", \"bech32\")\n        if chain == \"main\"\
        :\n            assert address.startswith(\"sugar1q\")\n        else:\n            assert len(node.rpc(\"\
        generatetoaddress\", 1, address)) == 1\nPY\n"
    - name: Run the packaged-source Apple Silicon regression suites
      shell: bash
      run: "set -euo pipefail\ntest \"$(lipo -archs incoming/test_bitcoin)\" = \"$ARCH\"\ndylibs=$(otool\
        \ -L incoming/test_bitcoin | sed -n '2,$p' | awk '{print $1}')\ntest -n \"$dylibs\"\nif echo \"\
        $dylibs\" | grep -Ev '^(/usr/lib/|/System/Library/)'; then\n  echo \"::error::Non-system shared\
        \ library in the regression executable\"\n  exit 1\nfi\nmkdir \"$RUNNER_TEMP/en7-regression\"\n\
        install -m755 incoming/test_bitcoin \"$RUNNER_TEMP/en7-regression/test_bitcoin\"\ncodesign --force\
        \ --sign - --timestamp=none \"$RUNNER_TEMP/en7-regression/test_bitcoin\"\ncodesign --verify --strict\
        \ \"$RUNNER_TEMP/en7-regression/test_bitcoin\"\n\"$RUNNER_TEMP/en7-regression/test_bitcoin\" \
        \  --run_test=policyestimator_tests,scheduler_tests,validationinterface_tests,streams_tests,blockmanager_tests,net_tests,disconnected_transactions,mempool_tests,crypto_tests,pow_tests,header_pow_tests,headers_sync_chainwork_tests,peerman_tests,caches_tests,chainstate_write_tests\
        \   --catch_system_error=no --log_level=test_suite --report_level=short\n\nbash release-tools/.github/diagnostics/en7-native-sync/run-differential.sh\
        \ \"$PWD\" \"$RUNNER_TEMP/en7-yespower-differential\"\n"
    - name: Compare signed Regtest synchronization on matching hardware
      shell: bash
      run: "#!/usr/bin/env bash\nset -euo pipefail\ntest \"$(uname -m)\" = arm64\ntest \"$(sysctl -in\
        \ sysctl.proc_translated 2>/dev/null || true)\" != 1\nprefix=sugarchain-en-31.1.2-macos-arm64\n\
        base=$(pwd)\ntools=\"$base/release-tools/.github/diagnostics/en7-native-sync\"\nroot=\"$RUNNER_TEMP/en7-native-synchronization\"\
        \nmkdir -p \"$root/home\" \"$root/baseline-archives\" \"$root/baseline\"\nexport CFFIXED_USER_HOME=\"\
        $root/home\"\ntest \"$(shasum -a 256 \"$tools/native-sync.py\" | awk '{print $1}')\" = d9dbf9c56e97f1eb2e06b1e185c622b07671368879e66976c844a411441eb4d4\n\
        test \"$(shasum -a 256 \"$tools/testnet7-fixture.json\" | awk '{print $1}')\" = 7ce81c9bafb6d66ae263eb7848cf0db4eebb5f54f52474adc3abbbb49f507f25\n\
        for file in \"$prefix-cli.tar.gz\" \"$prefix.zip\"; do\n  curl --fail --location --retry 3 --output\
        \ \"$root/baseline-archives/$file\" \\\n    \"https://github.com/decryp2kanon/sugarchain-en/releases/download/v31.1.2-en.6/$file\"\
        \ndone\n(cd \"$root/baseline-archives\" && shasum -a 256 -c \"$tools/baseline.sha256\")\ntar -xzf\
        \ \"$root/baseline-archives/$prefix-cli.tar.gz\" -C \"$root/baseline\"\nditto -x -k \"$root/baseline-archives/$prefix.zip\"\
        \ \"$root/baseline\"\ncodesign --verify --strict \"$root/baseline/$prefix-cli/bin/sugarchaind\"\
        \ncodesign --verify --deep --strict \"$root/baseline/Sugarchain-Qt.app\"\npython3 \"$tools/package-benchmark.py\"\
        \ \"$base\" \"$root\" \"$tools\"\n"
    - name: Record package inputs
      shell: bash
      run: "set -euo pipefail\ngit rev-parse HEAD > release/release-source-sha.txt\ngit rev-parse HEAD^{tree}\
        \ > release/release-source-tree.txt\n(\n  cd release\n  shasum -a 256 \"sugarchain-en-31.1.2-macos-$ARCH.zip\"\
        \ \\\n    \"sugarchain-en-31.1.2-macos-$ARCH-cli.tar.gz\" release-source-sha.txt release-source-tree.txt\
        \ \\\n    regtest-benchmark.json > package.sha256\n)\n"
    - name: Download the exact preceding native package
      uses: actions/download-artifact@v8
      with:
        name: release-mac-arm64
        run-id: '45799308927'
        repository: Sugarchain-CI/sugarchain-en
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/en8-depth-baseline
    - name: Compare pending depth in native CLI
      shell: bash
      run: "set -euo pipefail\npython3 -B release-tools/.github/en8-mainnet/depth-compare/depth_compare.py\
        \ \\\n  --baseline-artifact \"$RUNNER_TEMP/en8-depth-baseline\" --candidate-artifact \"$PWD/release\"\
        \ \\\n  --headers release-tools/.github/en8-mainnet/mainnet-headers-100k.bin.gz \\\n  --interface\
        \ cli --output \"$RUNNER_TEMP/en8-depth-cli\" \\\n  2>&1 | tee \"$RUNNER_TEMP/en8-depth-cli.log\"\
        \n"
    - name: Compare pending depth in native GUI
      shell: bash
      run: "set -euo pipefail\npython3 -B release-tools/.github/en8-mainnet/depth-compare/depth_compare.py\
        \ \\\n  --baseline-artifact \"$RUNNER_TEMP/en8-depth-baseline\" --candidate-artifact \"$PWD/release\"\
        \ \\\n  --headers release-tools/.github/en8-mainnet/mainnet-headers-100k.bin.gz \\\n  --interface\
        \ gui --output \"$RUNNER_TEMP/en8-depth-gui\" \\\n  2>&1 | tee \"$RUNNER_TEMP/en8-depth-gui.log\"\
        \n"
    - name: Retain complete pending-depth evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: en8-native-apple-depth
        path: '${{ runner.temp }}/en8-depth-*.log

          ${{ runner.temp }}/en8-depth-*/result.json

          ${{ runner.temp }}/en8-depth-*/*/trial.json

          ${{ runner.temp }}/en8-depth-*/*/datadir/debug.log

          ${{ runner.temp }}/en8-depth-*/*/datadir/console.log'
        if-no-files-found: warn
        retention-days: 30
    - uses: actions/upload-artifact@v7
      with:
        name: release-mac-${{ matrix.arch }}
        path: release/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - name: Report the packaged CLI synchronization medians
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYREPORT'\nimport json, os\nfrom pathlib import Path\nimport\
        \ shutil\nresult = json.loads(Path('release/regtest-benchmark.json').read_text())\nlines = ['##\
        \ Packaged Apple Silicon native synchronization', '',\n         '| Network | Package | Median\
        \ | Samples |', '| --- | --- | ---: | --- |']\nfor name, record in result['tests'].items():\n\
        \    network, package = name.split('-')\n    samples = ', '.join(f\"{sample['sync_seconds']:.6f}\"\
        \ for sample in record['samples'])\n    median = record['median_sync_seconds']\n    lines.append(f\"\
        | {network} | {package.upper()} | {median:.6f} s | {samples} |\")\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as output:\n    output.write('\\n'.join(lines) + '\\n')\nfor name in ('testnet7-cli', 'testnet7-gui'):\n\
        \    print(name, result['tests'][name]['median_sync_seconds'])\nPYREPORT\n"
