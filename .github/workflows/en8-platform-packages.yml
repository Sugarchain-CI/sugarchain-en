name: En8 native Windows ordered proof validation
'on':
  push:
    branches:
    - ci/en8-windows-ordered
    paths:
    - .github/workflows/en8-platform-packages.yml
    - .github/en8-mainnet/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  windows-cross:
    name: Windows-cross to x86_64, ${{ matrix.crt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          file-env: ./ci/test/00_setup_env_win64_msvcrt.sh
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          file-env: ./ci/test/00_setup_env_win64.sh
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      FILE_ENV: ${{ matrix.file-env }}
      DANGER_CI_ON_HOST_FOLDERS: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 7d33c6db80095cf5432b27f8ee91b1120a8e883a
        persist-credentials: false
        repository: decryp2kanon/sugarchain-en
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "7d33c6db80095cf5432b27f8ee91b1120a8e883a"

        test "$(git rev-parse HEAD^{tree})" = "e4521cdb8f98074f7bb696127815fd14bed51043"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Check out pinned verification tools
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: release-tools
        persist-credentials: false
    - name: Configure environment
      uses: ./.github/actions/configure-environment
    - name: Restore caches
      id: restore-cache
      uses: ./.github/actions/cache/restore
      with:
        provider: gha
    - name: Restore branch depends cache
      id: branch-depends
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.BASE_CACHE }}
        key: en8-win-${{ matrix.crt }}-depends-${{ env.DEPENDS_HASH }}
    - name: Restore branch compiler cache
      id: branch-compiler
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: en8-win-${{ matrix.crt }}-compiler-${{ env.DEPENDS_HASH }}-${{ github.run_id }}
        restore-keys: en8-win-${{ matrix.crt }}-compiler-${{ env.DEPENDS_HASH }}-
    - name: Configure Docker
      uses: ./.github/actions/configure-docker
      with:
        provider: gha
    - name: CI script
      run: 'set -euo pipefail

        source ./ci/test/00_setup_env.sh

        export BITCOIN_CONFIG="$BITCOIN_CONFIG -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI_TESTS=OFF
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

        python3 ./ci/test/02_run_container.py

        '
    - name: Verify Windows release code generation
      shell: bash
      run: python3 release-tools/.github/en8-mainnet/check-windows-codegen.py "$BASE_BUILD_DIR/compile_commands.json"
        "$BASE_BUILD_DIR/codegen.json" ${{ matrix.crt }}
    - name: Record package inputs
      run: 'set -euo pipefail

        git rev-parse HEAD > "$BASE_BUILD_DIR/release-source-sha.txt"

        git rev-parse "HEAD^{tree}" > "$BASE_BUILD_DIR/release-source-tree.txt"

        cd "$BASE_BUILD_DIR"

        test "$(basename "$(cat windows-installer-path.txt)")" = "Sugarchain-En-31.1.2-win64-setup.exe"

        sha256sum -- bin/sugarchain.exe bin/sugarchain-qt.exe bin/sugarchaind.exe bin/sugarchain-cli.exe
        bin/sugarchain-wallet.exe bin/sugarchain-tx.exe bin/sugarchain-util.exe Sugarchain-En-31.1.2-win64-setup.exe
        windows-installer-path.txt release-source-sha.txt release-source-tree.txt > SHA256SUMS.release-inputs

        '
    - name: Retain Windows release inputs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact-name }}-release-${{ github.run_id }}
        path: '${{ env.BASE_BUILD_DIR }}/bin/sugarchain.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchain-qt.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchaind.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchain-cli.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchain-wallet.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchain-tx.exe

          ${{ env.BASE_BUILD_DIR }}/bin/sugarchain-util.exe

          ${{ env.BASE_BUILD_DIR }}/Sugarchain-En-31.1.2-win64-setup.exe

          ${{ env.BASE_BUILD_DIR }}/windows-installer-path.txt

          ${{ env.BASE_BUILD_DIR }}/release-source-sha.txt

          ${{ env.BASE_BUILD_DIR }}/release-source-tree.txt

          ${{ env.BASE_BUILD_DIR }}/SHA256SUMS.release-inputs'
        if-no-files-found: error
        retention-days: 14
    - name: Retain Windows test inputs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact-name }}-test-${{ github.run_id }}
        path: '${{ env.BASE_BUILD_DIR }}/bin/*.dll

          ${{ env.BASE_BUILD_DIR }}/bin/*.exe

          ${{ env.BASE_BUILD_DIR }}/src/secp256k1/bin/*.exe

          ${{ env.BASE_BUILD_DIR }}/src/univalue/*.exe

          ${{ env.BASE_BUILD_DIR }}/test/config.ini

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain-qt.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchaind.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain-cli.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain-wallet.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain-tx.exe

          !${{ env.BASE_BUILD_DIR }}/bin/sugarchain-util.exe'
        if-no-files-found: error
        retention-days: 7
    - name: Save caches
      uses: ./.github/actions/cache/save
      with:
        provider: gha
    - name: Save branch depends cache
      if: ${{ !cancelled() && steps.branch-depends.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.BASE_CACHE }}
        key: en8-win-${{ matrix.crt }}-depends-${{ env.DEPENDS_HASH }}
    - name: Save branch compiler cache
      if: ${{ !cancelled() && steps.branch-compiler.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: en8-win-${{ matrix.crt }}-compiler-${{ env.DEPENDS_HASH }}-${{ github.run_id }}
    - name: Retain Windows code generation evidence
      uses: actions/upload-artifact@v7
      with:
        name: en8-codegen-${{ matrix.crt }}
        path: ${{ env.BASE_BUILD_DIR }}/codegen.json
        if-no-files-found: error
    timeout-minutes: 90
  windows-native-test:
    name: Windows, ${{ matrix.crt }}, test cross-built
    runs-on: windows-2022
    needs: windows-cross
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 7d33c6db80095cf5432b27f8ee91b1120a8e883a
        persist-credentials: false
        repository: decryp2kanon/sugarchain-en
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "7d33c6db80095cf5432b27f8ee91b1120a8e883a"

        test "$(git rev-parse HEAD^{tree})" = "e4521cdb8f98074f7bb696127815fd14bed51043"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Check out paired benchmark
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: release-tools
        persist-credentials: false
    - name: Download retained Windows release inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-release-${{ github.run_id }}
    - name: Verify downloaded package provenance
      shell: bash
      run: 'set -euo pipefail

        test "$(cat release-source-sha.txt)" = "7d33c6db80095cf5432b27f8ee91b1120a8e883a"

        test "$(cat release-source-tree.txt)" = "e4521cdb8f98074f7bb696127815fd14bed51043"

        sha256sum --check --strict SHA256SUMS.release-inputs

        '
    - name: Download retained Windows test inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-test-${{ github.run_id }}
    - name: Verify shared Windows GUI and daemon data paths
      run: py -3 .github/ci-native-datadir.py --daemon bin/sugarchaind.exe --gui bin/sugarchain-qt.exe
        --cli bin/sugarchain-cli.exe --workdir "$RUNNER_TEMP/en-native-datadir"
    - name: Run sugarchaind.exe
      run: py -3 .github/ci-windows-cross.py print_version
    - name: Import Visual Studio env vars
      run: py -3 .github/ci-windows.py "standard" github_import_vs_env
    - name: Check executable manifests
      run: py -3 .github/ci-windows-cross.py check_manifests
    - name: Prepare Windows test environment
      run: py -3 .github/ci-windows-cross.py prepare_tests
    - name: Run native network, GUI and wallet smoke checks
      run: py -3 .github/ci-windows-smoke.py --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-smoke-${{
        matrix.crt }}"
    - name: Reopen a saved wallet in the native GUI
      run: py -3 .github/ci-windows-smoke.py --verify-wallet-restart --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-wallet-restart-${{
        matrix.crt }}"
    - name: Verify installed applications and installer lifecycle
      run: "py -3 .github/ci-windows-installer.py --with-wallet-restart \\\n  --installer \"$(basename\
        \ \"$(cat windows-installer-path.txt)\")\" \\\n  --work-dir \"${RUNNER_TEMP}/en-installer-${{\
        \ matrix.crt }}\"\n"
    - name: Compare Windows synchronization against the published build
      run: "set -euo pipefail\nscript=\"$RUNNER_TEMP/en-windows-benchmark.py\"\ncurl --fail --silent --show-error\
        \ --location --retry 3 -o \"$script\" \"https://raw.githubusercontent.com/Sugarchain-CI/sugarchain-en/${{\
        \ github.sha }}/.github/release-test-tools/regtest-sync.py\"\nprintf \"%s  %s\\n\" 748ec293781c5ff60a7b467e7b559f534a9740fcfed202aa1553650e328cfa27\
        \ \"$script\" | sha256sum --check --strict\ncrt=\"${{ matrix.crt }}\"\ncase \"$crt\" in\n  msvcrt)\
        \ sha=3a45f6698e33e5c85822e7dd708dce5ba0ceabecbce14b8c27958f0f086c54c9 ;;\n  ucrt) sha=458f44d9ecd91324a9fc9b420c60a95d5ae140c29afe86f51bc790894b092346\
        \ ;;\n  *) exit 1 ;;\nesac\nbase=\"sugarchain-en-31.1.2-windows-x86_64-$crt-portable\"\ncurl --fail\
        \ --silent --show-error --location --retry 3 -o \"$RUNNER_TEMP/$base.zip\" \"https://github.com/decryp2kanon/sugarchain-en/releases/download/v31.1.2-en.2/$base.zip\"\
        \nprintf \"%s  %s\\n\" \"$sha\" \"$RUNNER_TEMP/$base.zip\" | sha256sum --check --strict\npy -3\
        \ -m zipfile -e \"$RUNNER_TEMP/$base.zip\" \"$RUNNER_TEMP/en-benchmark-baseline\"\npy -3 \"$script\"\
        \ --baseline-bin-dir \"$RUNNER_TEMP/en-benchmark-baseline/$base/daemon\" --candidate-bin-dir bin\
        \ --work-dir \"$RUNNER_TEMP/en-regtest-benchmark\" --blocks 3000 --repeats 3\n"
    - name: Retain Regtest benchmark evidence
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact-name }}-regtest-evidence-${{ github.run_id }}
        path: ${{ runner.temp }}/en-regtest-benchmark/result.json
        if-no-files-found: error
        retention-days: 14
    - name: Run Windows block storage and scheduler unit tests
      run: bin/test_bitcoin.exe --run_test=blockmanager_tests,wallet_tests,scheduler_tests,validationinterface_tests,crypto_tests,pow_tests,header_pow_tests,policyestimator_tests,peerman_tests,caches_tests,chainstate_write_tests
        --log_level=test_suite
    - name: Run Windows block storage functional tests
      run: py -3 test/functional/test_runner.py -j 2 --timeout-factor=8 --tmpdirprefix="$RUNNER_TEMP"
        feature_blocksdir.py feature_blocksxor.py feature_fastprune.py feature_reindex_readonly.py mining_sugarchain_regtest.py
    - name: Download exact preceding Windows release inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-release-45799308927
        run-id: '45799308927'
        repository: Sugarchain-CI/sugarchain-en
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/en8-ordered-baseline
    - name: Compare ordered Mainnet CLI proof execution
      shell: pwsh
      run: 'python -B release-tools/.github/en8-mainnet/windows-ordered/windows-ordered-presync.py --crt
        "${{ matrix.crt }}" --interface cli --baseline-root "$env:RUNNER_TEMP/en8-ordered-baseline" --candidate-root
        "$PWD" --candidate-sha 7d33c6db80095cf5432b27f8ee91b1120a8e883a --candidate-tree e4521cdb8f98074f7bb696127815fd14bed51043
        --headers-gz release-tools/.github/en8-mainnet/mainnet-headers-100k.bin.gz --output "$env:RUNNER_TEMP/en8-ordered-cli"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Compare ordered Mainnet GUI proof execution
      shell: pwsh
      run: 'python -B release-tools/.github/en8-mainnet/windows-ordered/windows-ordered-presync.py --crt
        "${{ matrix.crt }}" --interface gui --baseline-root "$env:RUNNER_TEMP/en8-ordered-baseline" --candidate-root
        "$PWD" --candidate-sha 7d33c6db80095cf5432b27f8ee91b1120a8e883a --candidate-tree e4521cdb8f98074f7bb696127815fd14bed51043
        --headers-gz release-tools/.github/en8-mainnet/mainnet-headers-100k.bin.gz --output "$env:RUNNER_TEMP/en8-ordered-gui"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Retain ordered proof comparison evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: en8-windows-ordered-${{ matrix.crt }}
        path: '${{ runner.temp }}/en8-ordered-*/result.json

          ${{ runner.temp }}/en8-ordered-*/*/node/debug.log

          ${{ runner.temp }}/en8-ordered-*/*/node/console.log'
        if-no-files-found: warn
        retention-days: 30
    timeout-minutes: 90
