name: En.8 release packages (macOS)

on:
  push:
    branches: [ci/en8-final-release]
    paths:
      - .github/workflows/en8-release-macos.yml
      - .github/en8-release/macos/**
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SOURCE: ba6ba77698f9a0759063604c4f87ce3eab93c107
  RELEASE_TREE: 585f08d47bc953b7863d2fc3ba51f3ea762bc36f

jobs:
  macos-cross:
    if: github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/ci/en8-final-release'
    name: Cross-build macOS ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            profile: ./ci/test/00_setup_env_mac_cross.sh
          - arch: x86_64
            profile: ./ci/test/00_setup_env_mac_cross_intel.sh
    env:
      FILE_ENV: ${{ matrix.profile }}
      DANGER_CI_ON_HOST_FOLDERS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: decryp2kanon/sugarchain-en
          ref: ${{ env.RELEASE_SOURCE }}
          persist-credentials: false
      - name: Verify release source and tree
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          git diff-index --quiet HEAD --
      - uses: ./.github/actions/configure-environment
      - uses: ./.github/actions/clear-files
      - uses: ./.github/actions/cache/restore
        with:
          provider: gha
      - uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.BASE_CACHE }}
            ${{ env.SOURCES_PATH }}
          key: en8-${{ matrix.arch }}-depends-v1-${{ env.DEPENDS_HASH }}
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: en8-${{ matrix.arch }}-ccache-v1-${{ env.DEPENDS_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: en8-${{ matrix.arch }}-ccache-v1-${{ env.DEPENDS_HASH }}-
      - uses: ./.github/actions/configure-docker
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          sparse-checkout: .github/en8-release/macos
          persist-credentials: false
      - name: Build static Qt, CLI and focused test executable
        run: bash ci-tools/.github/en8-release/macos/build-cross.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: en8-cross-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/en8-macos-transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos-package:
    name: Verify and package macOS ${{ matrix.arch }}
    needs: macos-cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          repository: decryp2kanon/sugarchain-en
          ref: ${{ env.RELEASE_SOURCE }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          sparse-checkout: .github/en8-release/macos
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: en8-cross-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/en8-macos-incoming
      - name: Sign and check the exact final archives on native hardware
        timeout-minutes: 25
        run: bash ci-tools/.github/en8-release/macos/package-native.sh "${{ matrix.arch }}"
      - name: Retain the verified release payloads and receipt
        uses: actions/upload-artifact@v7
        with:
          name: en8-release-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/en8-macos-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain native validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: en8-macos-validation-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/en8-macos-work/*.log
            ${{ runner.temp }}/en8-macos-work/protocol/functional.log
          if-no-files-found: ignore
          retention-days: 14
