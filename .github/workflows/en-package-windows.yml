name: En release packages (Windows)
'on':
  push:
    branches:
    - release-packaging/31.1.2-en.2-windows-native
    paths:
    - .github/workflows/en-package-windows.yml
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1
jobs:
  windows-native-test:
    name: Windows, ${{ matrix.crt }}, test cross-built
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 2d517b2a6c487dc8cf0021a8008e7ad7b8a3e99f
        persist-credentials: false
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "2d517b2a6c487dc8cf0021a8008e7ad7b8a3e99f"

        test "$(git rev-parse HEAD^{tree})" = "f504d3acafcb777cb906af7c6ee1a29336b20242"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Download retained Windows release inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-release-45558418634
        run-id: 45558418634
        github-token: ${{ github.token }}
    - name: Verify downloaded package provenance
      shell: bash
      run: 'set -euo pipefail

        test "$(cat release-source-sha.txt)" = "2d517b2a6c487dc8cf0021a8008e7ad7b8a3e99f"

        sha256sum --check --strict SHA256SUMS.release-inputs

        '
    - name: Download retained Windows test inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-test-45558418634
        run-id: 45558418634
        github-token: ${{ github.token }}
    - name: Verify shared Windows GUI and daemon data paths
      run: py -3 .github/ci-native-datadir.py --daemon bin/sugarchaind.exe --gui bin/sugarchain-qt.exe --cli bin/sugarchain-cli.exe --workdir "$RUNNER_TEMP/en-native-datadir"
    - name: Run sugarchaind.exe
      run: py -3 .github/ci-windows-cross.py print_version
    - name: Import Visual Studio env vars
      run: py -3 .github/ci-windows.py "standard" github_import_vs_env
    - name: Check executable manifests
      run: py -3 .github/ci-windows-cross.py check_manifests
    - name: Prepare Windows test environment
      run: py -3 .github/ci-windows-cross.py prepare_tests
    - name: Run native network, GUI and wallet smoke checks
      run: py -3 .github/ci-windows-smoke.py --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-smoke-${{ matrix.crt }}"
    - name: Reopen a saved wallet in the native GUI
      run: py -3 .github/ci-windows-smoke.py --verify-wallet-restart --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-wallet-restart-${{ matrix.crt }}"
    - name: Verify installed applications and installer lifecycle
      run: "py -3 .github/ci-windows-installer.py --with-wallet-restart \\\n  --installer \"$(basename \"$(cat windows-installer-path.txt)\")\" \\\n  --work-dir \"\
        ${RUNNER_TEMP}/en-installer-${{ matrix.crt }}\"\n"
    - name: Compare Windows block writes against the published build
      run: "set -euo pipefail\nscript=\"$RUNNER_TEMP/en-windows-benchmark.py\"\ncurl --fail --silent --show-error --location --retry 3 -o \"$script\" \"https://raw.githubusercontent.com/Sugarchain-CI/sugarchain-en/${{\
        \ github.sha }}/.github/release-test-tools/regtest-sync.py\"\nprintf \"%s  %s\\n\" 748ec293781c5ff60a7b467e7b559f534a9740fcfed202aa1553650e328cfa27 \"$script\"\
        \ | sha256sum --check --strict\ncrt='${{ matrix.crt }}'\ncase \"$crt\" in\n  msvcrt) sha=30e867d495a6becc193451d8323b27364bf97b020bb1400eaf266e3bc6120fd2\
        \ ;;\n  ucrt) sha=764ac0684608615164e8f636e43af1aa6b53c4bf4a61b0d7bd8abe154c7bc9dc ;;\n  *) exit 1 ;;\nesac\nbase=\"sugarchain-en-31.1.2-windows-x86_64-$crt-portable\"\
        \nurl=\"https://github.com/decryp2kanon/sugarchain-en/releases/download/v31.1.2-en.1/$base.zip\"\ncurl --fail --silent --show-error --location --retry 3 -o\
        \ \"$RUNNER_TEMP/$base.zip\" \"$url\"\nprintf \"%s  %s\\n\" \"$sha\" \"$RUNNER_TEMP/$base.zip\" | sha256sum --check --strict\npy -3 -m zipfile -e \"$RUNNER_TEMP/$base.zip\"\
        \ \"$RUNNER_TEMP/en-benchmark-baseline\"\npy -3 \"$script\" --baseline-bin-dir \"$RUNNER_TEMP/en-benchmark-baseline/$base/daemon\" --candidate-bin-dir bin\
        \ --work-dir \"$RUNNER_TEMP/en-regtest-benchmark\" --blocks 3000 --repeats 3\n"
    - name: Retain Regtest benchmark evidence
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact-name }}-regtest-evidence-${{ github.run_id }}
        path: ${{ runner.temp }}/en-regtest-benchmark/result.json
        if-no-files-found: error
        retention-days: 14
    - name: Run Windows block manager and wallet unit tests
      run: bin/test_bitcoin.exe --run_test=blockmanager_tests,wallet_tests --log_level=test_suite
    - name: Run Windows block storage functional tests
      run: py -3 test/functional/test_runner.py -j 2 --timeout-factor=8 --tmpdirprefix="$RUNNER_TEMP" feature_blocksdir.py feature_blocksxor.py feature_fastprune.py
        feature_reindex_readonly.py mining_sugarchain_regtest.py
