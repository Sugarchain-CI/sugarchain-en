name: En release packages (Windows)
'on':
  push:
    branches:
    - release-packaging/31.1.2-en.1-windows-final
    paths:
    - .github/workflows/en-package-windows.yml
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1
jobs:
  windows-native-test:
    name: Windows, ${{ matrix.crt }}, test cross-built
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: d68b443c027b1f962be73f715643fcafce4f51f1
        persist-credentials: false
    - name: Verify pinned source revision
      shell: bash
      run: 'set -euo pipefail

        actual=$(git rev-parse HEAD)

        test "$actual" = "d68b443c027b1f962be73f715643fcafce4f51f1"

        test "$(git rev-parse HEAD^{tree})" = "dafe8fad7cab941a149a9f7d9176c4eedd9b390d"

        printf "Source SHA: %s\n" "$actual" >> "$GITHUB_STEP_SUMMARY"'
    - name: Download built executables
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-45541371909
        run-id: 45541371909
        github-token: ${{ github.token }}
    - name: Verify downloaded package provenance
      shell: bash
      run: test "$(cat release-source-sha.txt)" = "d68b443c027b1f962be73f715643fcafce4f51f1"
    - name: Verify shared Windows GUI and daemon data paths
      run: py -3 .github/ci-native-datadir.py --daemon bin/sugarchaind.exe --gui bin/sugarchain-qt.exe --cli bin/sugarchain-cli.exe --workdir "$RUNNER_TEMP/en-native-datadir"
    - name: Run sugarchaind.exe
      run: py -3 .github/ci-windows-cross.py print_version
    - name: Import Visual Studio env vars
      run: py -3 .github/ci-windows.py "standard" github_import_vs_env
    - name: Check executable manifests
      run: py -3 .github/ci-windows-cross.py check_manifests
    - name: Check out Testnet7 smoke tooling
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: release-tools
        sparse-checkout: '.github/ci-windows-smoke.py

          .github/ci-windows-installer.py

          '
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Run native network, GUI and wallet smoke checks
      run: py -3 release-tools/.github/ci-windows-smoke.py --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-smoke-${{ matrix.crt }}"
    - name: Reopen a saved wallet in the native GUI
      run: py -3 release-tools/.github/ci-windows-smoke.py --verify-wallet-restart --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-wallet-restart-${{ matrix.crt }}"
    - name: Verify installed applications and installer lifecycle
      run: "py -3 release-tools/.github/ci-windows-installer.py --with-wallet-restart \\\n  --installer \"$(basename \"$(cat windows-installer-path.txt)\")\" \\\n  --work-dir \"${RUNNER_TEMP}/en-installer-${{ matrix.crt }}\"\n"
