name: En8 Apple fixed Yespower proof screen
on:
  push:
    branches: [ci/en8-apple-fixed-proof]
    paths:
      - .github/workflows/en8-apple-fixed-proof.yml
      - .github/apple-fixed-proof/**
permissions:
  contents: read
jobs:
  native-proof-screen:
    name: Check full proofs and measure native Apple fixed-entry throughput
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          repository: Sugarchain-CI/sugarchain-en
          ref: 9c502574b652804905d2533d51742ca91f694532
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: diagnostic
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the pinned native diagnostic once
        shell: bash
        run: |
          bash diagnostic/.github/apple-fixed-proof/run-native-fixed.sh \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/apple-fixed-proof"
      - name: Retain proof, timing and compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: en8-apple-fixed-proof
          path: |
            ${{ runner.temp }}/apple-fixed-proof/*.log
            ${{ runner.temp }}/apple-fixed-proof/*.txt
            ${{ runner.temp }}/apple-fixed-proof/*.sha256
            ${{ runner.temp }}/apple-fixed-proof/build/build.json
            ${{ runner.temp }}/apple-fixed-proof/build/fixed-sugar.c
            ${{ runner.temp }}/apple-fixed-proof/evidence
          if-no-files-found: warn
          retention-days: 14
