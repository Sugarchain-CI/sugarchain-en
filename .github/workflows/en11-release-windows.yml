name: En.11 Windows release and stock synchronization qualification
permissions:
  contents: read
env:
  PRODUCT_SOURCE: 06023b7940fa3669605561f8844648c03abc673c
  PRODUCT_TREE: d628b9e960b99e373e6802ab25c3bdbc1e2a405a
  PYTHONUTF8: 1
defaults:
  run:
    shell: bash
jobs:
  windows-cross:
    name: Build Windows x64 ${{ matrix.crt }} release inputs
    if: github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/ci/en11-final-release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - crt: ucrt
          file-env: ./ci/test/00_setup_env_win64.sh
        - crt: msvcrt
          file-env: ./ci/test/00_setup_env_win64_msvcrt.sh
    env:
      FILE_ENV: ${{ matrix.file-env }}
      DANGER_CI_ON_HOST_FOLDERS: 1
      MAKEJOBS: -j4
    steps:
    - name: Check out release helpers
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out exact merged product source
      uses: actions/checkout@v6
      with:
        repository: decryp2kanon/sugarchain-en
        ref: ${{ env.PRODUCT_SOURCE }}
        path: product
        persist-credentials: false
    - name: Configure Windows cross-build environment
      working-directory: product
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$PRODUCT_SOURCE\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$PRODUCT_TREE\"\nsource \"$FILE_ENV\"\n{\n  echo \"BASE_ROOT_DIR=$RUNNER_TEMP\"\n  echo \"BASE_BUILD_DIR=$RUNNER_TEMP/build\"\n  echo \"CCACHE_DIR=$RUNNER_TEMP/ccache_dir\"\n  echo \"DEPENDS_DIR=$RUNNER_TEMP/depends\"\n  echo \"BASE_CACHE=$RUNNER_TEMP/depends/built\"\n  echo \"SOURCES_PATH=$RUNNER_TEMP/depends/sources\"\n  echo \"PREVIOUS_RELEASES_DIR=$RUNNER_TEMP/previous_releases\"\n  echo \"DEPENDS_HASH=$(git ls-tree HEAD depends \"$FILE_ENV\" | sha256sum | cut -d' ' -f1)\"\n  echo \"PREVIOUS_RELEASES_HASH=$(git ls-tree HEAD test/get_previous_releases.py | sha256sum | cut -d' ' -f1)\"\n  echo \"CONTAINER_NAME=$CONTAINER_NAME\"\n} >> \"$GITHUB_ENV\"\n"
    - name: Restore stock build caches
      uses: ./.github/actions/cache/restore
      with:
        provider: gha
    - name: Restore previously built Windows dependencies
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.BASE_CACHE }}
        key: en8-win-${{ matrix.crt }}-depends-${{ env.DEPENDS_HASH }}
    - name: Restore Windows compiler objects
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: en8-win-${{ matrix.crt }}-compiler-${{ env.DEPENDS_HASH }}-${{ github.run_id }}
        restore-keys: en8-win-${{ matrix.crt }}-compiler-${{ env.DEPENDS_HASH }}-
    - name: Configure the standard Docker build
      uses: ./.github/actions/configure-docker
      with:
        provider: gha
    - name: Build exact product daemon, GUI, installer and test executable
      working-directory: product
      run: 'set -eo pipefail

        source ./ci/test/00_setup_env.sh

        export BITCOIN_CONFIG="$BITCOIN_CONFIG -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_GUI_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

        python3 ./ci/test/02_run_container.py

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Verify Windows release code generation
      run: "set -euo pipefail\npython -B .github/en11-release/windows/check-windows-codegen.py \\\n  \"$BASE_BUILD_DIR/compile_commands.json\" \"$RUNNER_TEMP/en11-codegen.json\" \"${{ matrix.crt }}\"\n"
    - name: Package the exact installer programs and release notices
      timeout-minutes: 12
      run: "set -euo pipefail\nif ! command -v 7zz >/dev/null && ! command -v 7z >/dev/null; then\n  sudo apt-get -qq update\n  sudo apt-get -qq install --no-install-recommends -y 7zip\nfi\nseven_zip=$(command -v 7zz || command -v 7z)\ncurl --fail --location --silent --show-error --max-time 120 --retry 2 \\\n  'https://github.com/decryp2kanon/sugarchain-en/releases/download/v31.1.2-en.7/sugarchain-en-31.1.2-windows-third-party-notices.zip' \\\n  --output \"$RUNNER_TEMP/en7-notices.zip\"\npython -B .github/en11-release/windows/package_windows.py stage --source product \\\n  --build \"$BASE_BUILD_DIR\" --out \"$RUNNER_TEMP/en11-windows-staged\" --crt \"${{ matrix.crt }}\" \\\n  --notices \"$RUNNER_TEMP/en7-notices.zip\" --codegen \"$RUNNER_TEMP/en11-codegen.json\" --seven-zip \"$seven_zip\"\n"
    - name: Upload Windows native verification inputs
      uses: actions/upload-artifact@v7
      with:
        name: en11-release-windows-staged-${{ matrix.crt }}
        path: ${{ runner.temp }}/en11-windows-staged/
        if-no-files-found: error
        retention-days: 7
  windows-native:
    name: Verify native Windows x64 ${{ matrix.crt }} release
    if: github.repository == 'Sugarchain-CI/sugarchain-en' && github.ref == 'refs/heads/ci/en11-final-release'
    needs: windows-cross
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crt:
        - ucrt
        - msvcrt
    steps:
    - name: Check out release helpers
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out exact merged product tests
      uses: actions/checkout@v6
      with:
        repository: decryp2kanon/sugarchain-en
        ref: ${{ env.PRODUCT_SOURCE }}
        path: product
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Download exact current Windows package and test inputs
      uses: actions/download-artifact@v8
      with:
        name: en11-release-windows-staged-${{ matrix.crt }}
        path: ${{ runner.temp }}/en11-windows-staged
    - name: Verify package provenance and prepare the exact native executables
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/en11-windows-logs\"\npython -B .github/en11-release/windows/package_windows.py prepare --source product --crt \"${{ matrix.crt }}\" \\\n  --staged \"$RUNNER_TEMP/en11-windows-staged\"\n"
    - name: Run affected native unit groups
      working-directory: product
      timeout-minutes: 10
      run: "set -euo pipefail\nbin/test_bitcoin.exe --run_test=net_tests,header_pow_tests,headers_sync_chainwork_tests,caches_tests,blockmanager_tests,peerman_tests,streams_tests \\\n  --color_output=no --report_level=short --log_level=test_suite 2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/unit-tests.log\"\nunit_log=\"$RUNNER_TEMP/en11-windows-logs/unit-tests.log\"\nfor test_case in windows_block_and_undo_write_buffer_boundaries windows_cached_writer_position_and_obfuscation; do\n  for marker in Entering Leaving; do\n    test \"$(grep -Fc \"$marker test case \\\"$test_case\\\"\" \"$unit_log\")\" = 1\n  done\ndone\nbin/test_bitcoin.exe --run_test=crypto_tests/yespower_golden_vectors --color_output=no --report_level=short \\\n  2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/yespower-golden-vectors.log\"\nbin/test_bitcoin.exe --run_test=crypto_tests/sha256_testvectors --color_output=no --report_level=short \\\n  2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/sha256-testvectors.log\"\n"
    - name: Run the Sugarchain header proof protocol test
      working-directory: product
      timeout-minutes: 8
      run: "set -euo pipefail\npython -B test/functional/p2p_sugarchain_header_pow.py --configfile test/config.ini \\\n  --tmpdir \"$RUNNER_TEMP/en11-header-protocol\" --timeout-factor=8 --v1transport \\\n  2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/header-protocol.log\"\n"
    - name: Run packaged daemon, CLI and GUI smoke checks
      working-directory: product
      timeout-minutes: 6
      run: "set -euo pipefail\nbin/sugarchaind.exe -version | tee \"$RUNNER_TEMP/en11-windows-logs/binary-version.log\"\npython -B .github/ci-windows-smoke.py --bindir bin --work-dir \"$RUNNER_TEMP/en11-portable-smoke\" \\\n  2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/portable-smoke.log\"\n"
    - name: Verify the installer lifecycle and installed applications
      working-directory: product
      timeout-minutes: 6
      run: "set -euo pipefail\npython -B .github/ci-windows-installer.py --with-wallet-restart \\\n  --installer \"$RUNNER_TEMP/en11-windows-staged/sugarchain-en-31.1.2-windows-x86_64-${{ matrix.crt }}-setup.exe\" \\\n  --work-dir \"$RUNNER_TEMP/en11-installer-smoke\" 2>&1 | tee \"$RUNNER_TEMP/en11-windows-logs/installer-smoke.log\"\n"
    - name: Record exact package and successful native evidence
      run: "set -euo pipefail\npython -B .github/en11-release/windows/package_windows.py conclude --source product --crt \"${{ matrix.crt }}\" \\\n  --staged \"$RUNNER_TEMP/en11-windows-staged\" --logs \"$RUNNER_TEMP/en11-windows-logs\" --run-id \"$GITHUB_RUN_ID\"\ncp \"$RUNNER_TEMP/en11-windows-logs/\"*.log \"$RUNNER_TEMP/en11-windows-staged/\"\n"
    - name: Compare baseline and candidate with detailed debug disabled
      run: python -B .github/en11-release/measure/run-paired-ci.py --platform windows --candidate-dir "$RUNNER_TEMP/en11-windows-staged" --output "$RUNNER_TEMP/en11-paired" --crt "${{ matrix.crt }}"
    - name: Upload verified Windows release assets
      uses: actions/upload-artifact@v7
      with:
        name: en11-release-windows-${{ matrix.crt }}
        path: '${{ runner.temp }}/en11-windows-staged/*.zip

          ${{ runner.temp }}/en11-windows-staged/*.exe

          ${{ runner.temp }}/en11-windows-staged/*.json

          ${{ runner.temp }}/en11-windows-staged/*.log

          ${{ runner.temp }}/en11-windows-staged/RELEASE_SOURCE_SHA

          ${{ runner.temp }}/en11-windows-staged/RELEASE_SOURCE_TREE

          ${{ runner.temp }}/en11-windows-staged/SHA256SUMS*

          '
        if-no-files-found: error
        retention-days: 14
    - name: Retain failed native evidence
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: en11-release-windows-failure-${{ matrix.crt }}
        path: ${{ runner.temp }}/en11-windows-logs/
        if-no-files-found: warn
        retention-days: 14
    - name: Retain paired native synchronization evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: en11-paired-windows-${{ matrix.crt }}
        path: '${{ runner.temp }}/en11-paired/evidence.tar.gz

          ${{ runner.temp }}/en11-paired/comparison-summary.json'
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_dispatch: null
  push:
    branches:
    - ci/en11-final-release
    paths:
    - .github/workflows/en11-release-windows.yml
    - .github/en11-release/windows/**
    - .github/en11-release/measure/**
    - .github/en11-release/.gitattributes
