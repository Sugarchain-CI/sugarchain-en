name: CI ancestor validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test-ancestor-batch:
    name: test ancestor commits (batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch:
        - 1
        - 2
        - 3
        - 4
    env:
      BASE_COMMIT: e3535c1c488704b58d93aa900a438d10df1a2db2
      TEST_RUNNER_TIMEOUT_FACTOR: 40
      TEST_RUNNER_PORT_MIN: '14000'
      CANDIDATE_SHA: 46722b18e3af318e62cce732cd5bdda00a7012ec
      CANDIDATE_TREE: 487aae1e5a05805d3cabb837ef62b5ab770e538e
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 46722b18e3af318e62cce732cd5bdda00a7012ec
        fetch-depth: 20
        persist-credentials: false
    - name: Verify frozen candidate
      run: 'test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"

        test "$(git rev-list --first-parent --count "$BASE_COMMIT..HEAD")" = 18

        '
    - name: Select ancestor commits
      id: range
      env:
        BATCH: ${{ matrix.batch }}
        BATCHES: ${{ strategy.job-total }}
      run: "git fetch --no-tags origin \"$BASE_COMMIT\"\ntip=$(git rev-parse HEAD^)\n# The main matrix covers the PR head. Keep earlier work on the PR\n# after a\
        \ merge and exclude the side branch by following first parents.\ngit rev-list --first-parent --reverse \"$BASE_COMMIT..$tip\" > \"$RUNNER_TEMP/ancestor-range\"\
        \nmapfile -t ancestors < \"$RUNNER_TEMP/ancestor-range\"\nbegin=$(( ${#ancestors[@]} * (BATCH - 1) / BATCHES ))\nend=$(( ${#ancestors[@]} * BATCH / BATCHES\
        \ ))\nfor ((i=begin; i<end; i++)); do\n  echo \"${ancestors[i]}\"\ndone > \"$RUNNER_TEMP/ancestor-commits\"\necho \"count=$((end - begin))\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Install build dependencies
      if: steps.range.outputs.count != '0'
      run: 'sudo apt-get update

        sudo apt-get install clang mold ccache build-essential cmake ninja-build pkgconf python3-zmq libevent-dev libboost-dev libsqlite3-dev systemtap-sdt-dev libzmq3-dev
        qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev capnproto libcapnp-dev -y

        sudo pip3 install --break-system-packages pycapnp

        '
    - name: Compile and run tests
      if: steps.range.outputs.count != '0'
      run: "git config user.email \"ci@example.com\"\ngit config user.name \"CI\"\n# Keep the PR head's test driver while building and testing each ancestor's sources.\n\
        cp .github/ci-test-each-commit-exec.py \"$RUNNER_TEMP/ci-test-each-commit-exec.py\"\nwhile read -r revision; do\n  git checkout --detach \"$revision\"\n \
        \ git merge --no-commit --no-ff \"$BASE_COMMIT\"\n  python3 \"$RUNNER_TEMP/ci-test-each-commit-exec.py\"\n  if git rev-parse --verify -q MERGE_HEAD >/dev/null;\
        \ then\n    git merge --abort\n  fi\ndone < \"$RUNNER_TEMP/ancestor-commits\"\n"
  test-each-commit:
    name: test ancestor commits
    needs: test-ancestor-batch
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    steps:
    - name: Check all ancestor batches
      env:
        RESULT: ${{ needs.test-ancestor-batch.result }}
      run: test "$RESULT" = success
