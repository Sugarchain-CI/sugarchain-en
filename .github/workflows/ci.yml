name: Testnet5 only

on:
  push:
    branches: [testnet-validation/testnet5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    name: Testnet5 mining and wallet transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TESTNET_SOURCE_SHA: cfdc40e7e8d0aae2a42521d64eea3f66af53e9a2
      TESTNET_SOURCE_TREE: ed7326e38719442217fe0c6648a81265ff303a73
      TEST_RUNNER_PORT_MIN: '28000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cfdc40e7e8d0aae2a42521d64eea3f66af53e9a2
          persist-credentials: false
      - name: Verify candidate source
        run: |
          test "$(git rev-parse HEAD)" = "$TESTNET_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TESTNET_SOURCE_TREE"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ pkgconf libevent-dev libboost-dev libsqlite3-dev
      - name: Build Testnet5 daemon and CLI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_KERNEL_LIB=OFF -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF -DENABLE_WALLET=ON
          cmake --build build --parallel 4 --target bitcoind bitcoin-cli
      - name: Check Testnet5 startup, mining, relay and wallet
        run: |
          build/test/functional/test_runner.py --jobs 1 --timeout-factor=2 --combinedlogslen=0 \
            feature_sugarchain_testnet.py | tee testnet-ci.log
          grep -Eq 'feature_sugarchain_testnet.py passed' testnet-ci.log
      - name: Preserve the targeted test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testnet5-functional-evidence
          path: testnet-ci.log
          if-no-files-found: ignore
