name: Published 31.1.1 Windows wizard runtime
permissions:
  contents: read
jobs:
  windows:
    name: Published Windows x86-64 (${{ matrix.crt }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crt:
        - ucrt
        - msvcrt
    env:
      RELEASE_CRT: ${{ matrix.crt }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Fetch and verify the public Windows downloads
      shell: pwsh
      run: '$stem = "sugarchain-en-31.1.1-windows-x86_64-$env:RELEASE_CRT"

        py -3 .github/public-release-smoke/fetch-public-assets.py --output "$env:RUNNER_TEMP/public-downloads" "$stem-setup.exe" "$stem-portable.zip"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install test screenshot support
      shell: pwsh
      run: py -3 -m pip install --disable-pip-version-check Pillow
    - name: Check Windows installed and portable runtime
      shell: pwsh
      run: 'py -3 .github/public-release-smoke/windows-smoke.py --source "$env:GITHUB_WORKSPACE" --assets "$env:RUNNER_TEMP/public-downloads" --workdir "$env:RUNNER_TEMP/public-windows-runtime" --crt "$env:RELEASE_CRT"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Upload Windows verification results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: published-windows-${{ matrix.crt }}-results
        path: '${{ runner.temp }}/public-downloads/integrity.json

          ${{ runner.temp }}/public-windows-runtime/result.json

          ${{ runner.temp }}/public-windows-runtime/screenshots/*.png

          '
        if-no-files-found: ignore
'on':
  push:
    branches:
    - release-validation/windows-wizard-31.1.1
  workflow_dispatch: null
