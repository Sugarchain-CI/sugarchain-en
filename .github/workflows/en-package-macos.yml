name: Intel cross LTO comparison and profiling (diagnostic)
'on':
  push:
    branches:
    - release-packaging/31.1.2-en.6-macos
    paths:
    - .github/workflows/en-package-macos.yml
    - .github/diagnostics/intel-cross-profile/**
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  cross-profile:
    name: Cross-build default, O3 relink, and profile daemons
    if: github.ref == 'refs/heads/release-packaging/31.1.2-en.6-macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FILE_ENV: ./ci/test/00_setup_env_mac_cross_intel.sh
      DANGER_CI_ON_HOST_FOLDERS: '1'
      CCACHE_MAXSIZE: 2G
    steps:
    - &id001
      name: Check out pinned canonical source
      uses: actions/checkout@v6
      with:
        repository: decryp2kanon/sugarchain-en
        ref: 8400a011d8d4879fb606d50c263b6e4801213605
        persist-credentials: false
    - &id002
      name: Check out the reviewed diagnostic overlay separately
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: .diagnostic-inputs
        persist-credentials: false
    - uses: ./.github/actions/configure-environment
    - uses: ./.github/actions/clear-files
    - uses: ./.github/actions/cache/restore
      with:
        provider: gha
    - uses: ./.github/actions/configure-docker
      with:
        provider: gha
    - name: Build default, relink identical bitcode, then build O3 diagnostics
      shell: bash
      run: bash .diagnostic-inputs/.github/diagnostics/intel-cross-profile/build-cross.sh
    - name: Save bounded compiler cache on this release branch
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CONTAINER_NAME }}-${{ github.run_id }}
    - name: Save depends sources for release-branch followups
      if: ${{ success() && env['depends-sources-cache-hit'] != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.SOURCES_PATH }}
        key: depends-sources-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
    - name: Save built depends for release-branch followups
      if: ${{ success() && env['depends-built-cache-hit'] != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.BASE_CACHE }}
        key: depends-built-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
    - name: Upload only daemon variants and compiler/source evidence
      uses: actions/upload-artifact@v7
      with:
        name: intel-cross-lto-daemons
        path: ${{ env.BASE_BUILD_DIR }}/profile-transfer/
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
  intel-profile:
    name: Measure on standard Intel macOS
    if: github.ref == 'refs/heads/release-packaging/31.1.2-en.6-macos'
    needs: cross-profile
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
    - *id001
    - *id002
    - uses: actions/download-artifact@v8
      with:
        name: intel-cross-lto-daemons
        path: incoming-profile
    - name: Download the exact signed En6 reference from run 45677529513
      uses: actions/download-artifact@v8
      with:
        name: release-mac-x86_64
        path: original-package
        run-id: 45677529513
        repository: Sugarchain-CI/sugarchain-en
        github-token: ${{ github.token }}
    - name: Compare default versus O3 and collect separate diagnostics
      shell: bash
      run: bash .diagnostic-inputs/.github/diagnostics/intel-cross-profile/run-profile.sh
    - name: Retain bounded measurements and stage logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: intel-cross-lto-results
        path: ${{ runner.temp }}/profile-results/
        if-no-files-found: warn
        retention-days: 7
