name: Published Regtest synchronization benchmark (native)
'on':
  push:
    branches:
      - automation/regtest-en3-macos-20261125

permissions:
  contents: read

jobs:
  regtest:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      BENCH_ARCH: ${{ matrix.arch }}
      BENCH_RUNNER: ${{ matrix.runner }}
      RELEASE: v31.1.2-en.3
    steps:
      - name: Check out benchmark
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download and verify public macOS archives
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$BENCH_ARCH"
          mkdir "$RUNNER_TEMP/regtest-evidence" "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          name="sugarchain-en-31.1.2-macos-$BENCH_ARCH"
          for asset in "$name-cli.tar.gz" "$name.zip"; do
            curl --retry 4 --retry-all-errors --connect-timeout 20 -fsSL \
              "https://github.com/decryp2kanon/sugarchain-en/releases/download/$RELEASE/$asset" \
              -o "$asset"
            hash=$(awk -v asset="$asset" '$2 == asset {print $1}' "$GITHUB_WORKSPACE/benchmark-SHA256SUMS")
            printf '%s  %s\n' "$hash" "$asset" | shasum -a 256 -c -
          done
          tar -xzf "$name-cli.tar.gz"
          ditto -x -k "$name.zip" .
          {
            printf 'CLI=%s\n' "$RUNNER_TEMP/published/$name-cli/bin/sugarchaind"
            printf 'GUI=%s\n' "$RUNNER_TEMP/published/Sugarchain-Qt.app/Contents/MacOS/Sugarchain-Qt"
            printf 'CLI_ARCHIVE=%s\n' "$name-cli.tar.gz"
            printf 'GUI_ARCHIVE=%s\n' "$name.zip"
          } >> "$GITHUB_ENV"

      - name: Measure daemon and GUI
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/regtest-evidence"
          sw_vers > "$result/macos.txt"
          sysctl machdep.cpu.brand_string hw.logicalcpu hw.memsize >> "$result/macos.txt" || true
          for variant in cli gui; do
            if [[ "$variant" == cli ]]; then
              archive="$CLI_ARCHIVE"
              set --
            else
              archive="$GUI_ARCHIVE"
              set -- --gui "$GUI"
            fi
            hash=$(awk -v asset="$archive" '$2 == asset {print $1}' benchmark-SHA256SUMS)
            python3 regtest-sync-macos.py --cli "$CLI" "$@" --runner "$BENCH_RUNNER" \
              --asset-sha256 "$hash" --work-dir "$RUNNER_TEMP/regtest-$variant" \
              --blocks 10000 --repeats 3
            cp "$RUNNER_TEMP/regtest-$variant/result.json" "$result/$variant.json"
          done

      - name: Retain results and startup logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regtest-en3-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/regtest-evidence/
            ${{ runner.temp }}/regtest-gui/*/console.log
          if-no-files-found: warn
          retention-days: 7
