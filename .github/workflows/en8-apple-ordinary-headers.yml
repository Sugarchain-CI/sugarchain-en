name: En8 Apple ordinary Mainnet header comparison
on:
  push:
    branches: [ci/en8-apple-index-cache]
    paths:
      - .github/workflows/en8-apple-ordinary-headers.yml
      - .github/apple-ordinary-headers/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build Apple ARM64 ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: candidate
            source: a497c9abf5e5247d8cdc9448073310f55ea25216
          - role: control
            source: 1b3029359223d7cee5da852762c04f2aac700a88
    env:
      FILE_ENV: ./ci/test/00_setup_env_mac_cross.sh
      DANGER_CI_ON_HOST_FOLDERS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Sugarchain-CI/sugarchain-en
          ref: ${{ matrix.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/configure-environment
      - uses: ./.github/actions/clear-files
      - uses: ./.github/actions/cache/restore
        with:
          provider: gha
      - uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.BASE_CACHE }}
            ${{ env.SOURCES_PATH }}
          key: en8-arm64-depends-v1-${{ env.DEPENDS_HASH }}
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: en8-arm64-ccache-v1-${{ env.DEPENDS_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: en8-arm64-ccache-v1-${{ env.DEPENDS_HASH }}-
      - uses: ./.github/actions/configure-docker
        with:
          provider: gha
      - name: Build the matched Apple CLI and test executables
        run: |
          set -eo pipefail
          source ./ci/test/00_setup_env.sh
          export GOAL=install
          export BASE_OUTDIR="$BASE_BUILD_DIR/installed"
          export BITCOIN_CONFIG="$(echo '
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_CXX_FLAGS_RELEASE=-O3
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DBUILD_SHARED_LIBS=OFF -DREDUCE_EXPORTS=ON -DBUILD_GUI=OFF -DENABLE_WALLET=ON
            -DENABLE_IPC=OFF -DBUILD_TESTS=ON -DBUILD_GUI_TESTS=OFF -DBUILD_BENCH=OFF
            -DBUILD_FUZZ_BINARY=OFF -DINSTALL_MAN=OFF -DWITH_USDT=OFF' | xargs)"
          python3 ./ci/test/02_run_container.py
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Verify source, tree and Apple ARM64 build
        env:
          BUILD_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          python3 -B diagnostic/.github/apple-ordinary-headers/runtime_receipt.py collect \
            --role "$BUILD_ROLE" --source "$PWD" --build "$BASE_BUILD_DIR" \
            --depends "$DEPENDS_HASH" --output "$RUNNER_TEMP/ordinary-cross"
      - uses: actions/upload-artifact@v7
        with:
          name: apple-ordinary-cross-${{ matrix.role }}
          path: ${{ runner.temp }}/ordinary-cross
          if-no-files-found: error
          retention-days: 14
  native:
    name: Verify and compare ordinary Mainnet headers on native Apple Silicon
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Sugarchain-CI/sugarchain-en
          ref: a497c9abf5e5247d8cdc9448073310f55ea25216
          path: candidate-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: apple-ordinary-cross-*
          path: ${{ runner.temp }}/ordinary-incoming
      - name: Verify source and native executable identity
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          test "$(git -C candidate-source rev-parse HEAD)" = a497c9abf5e5247d8cdc9448073310f55ea25216
          test "$(git -C candidate-source rev-parse 'HEAD^{tree}')" = ae2b3387d424a0d257e5584f5f7d76ce3f434898
          mkdir "$RUNNER_TEMP/ordinary-evidence"
          {
            sw_vers
            sysctl machdep.cpu.brand_string hw.logicalcpu hw.memsize hw.pagesize
            git rev-parse HEAD 'HEAD^{tree}'
          } > "$RUNNER_TEMP/ordinary-evidence/environment.log"
          python3 -B .github/apple-ordinary-headers/runtime_receipt.py stage \
            --incoming "$RUNNER_TEMP/ordinary-incoming" --output "$RUNNER_TEMP/ordinary-runtime" \
            > "$RUNNER_TEMP/ordinary-evidence/stage.log" 2>&1
          cp "$RUNNER_TEMP/ordinary-runtime/runtime.json" "$RUNNER_TEMP/ordinary-evidence/"
      - name: Run affected networking, proof and ordinary validation suites
        timeout-minutes: 18
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ordinary-runtime/candidate/test_bitcoin" \
            --run_test=net_tests,peerman_tests,pow_tests,header_pow_tests,headers_sync_chainwork_tests,blockmanager_tests,validationinterface_tests \
            --catch_system_error=no --log_level=test_suite --report_level=short \
            > "$RUNNER_TEMP/ordinary-evidence/native-tests.log" 2>&1
      - name: Run signed native header proof protocol regressions
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ordinary-package/bin"
          cp "$RUNNER_TEMP/ordinary-runtime/candidate/"{sugarchaind,sugarchain-cli} "$RUNNER_TEMP/ordinary-package/bin/"
          python3 -B .github/en8-mainnet/overlap/run-signed-mac-header-pow.py \
            --source candidate-source --package "$RUNNER_TEMP/ordinary-package" \
            --work "$RUNNER_TEMP/ordinary-protocol" > "$RUNNER_TEMP/ordinary-evidence/protocol.log" 2>&1
      - name: Compare the fixed ordinary acceptance window
        timeout-minutes: 26
        run: |
          set -euo pipefail
          python3 -B .github/apple-ordinary-headers/measure.py --runtime "$RUNNER_TEMP/ordinary-runtime" \
            --headers .github/en8-mainnet/mainnet-headers-100k.bin.gz --case-root "$RUNNER_TEMP/ordinary-cases" \
            --output "$RUNNER_TEMP/ordinary-evidence/matrix" > "$RUNNER_TEMP/ordinary-evidence/matrix.log" 2>&1
      - name: Retain all available native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: en8-apple-ordinary-headers-native
          path: ${{ runner.temp }}/ordinary-evidence
          if-no-files-found: warn
          retention-days: 14
