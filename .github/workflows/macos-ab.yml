name: Intel macOS checked storage and scheduler comparison
'on':
  push:
    branches:
    - automation/en6-intel-sync-round2-fixed
permissions:
  contents: read
jobs:
  compare:
    name: macOS cache comparison ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: macos-15-intel
    steps:
    - name: Check out benchmark inputs
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Check out verified En.4 source
      uses: actions/checkout@v6
      with:
        path: source
        repository: decryp2kanon/sugarchain-en
        ref: 13a5822c27a5097f72f97262413c243d7db57708
        persist-credentials: false
    - name: Restore compiler cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/macos-subsecond-ccache
        key: macos-subsecond-${{ matrix.arch }}-${{ github.run_id }}
        restore-keys: macos-subsecond-${{ matrix.arch }}-
    - name: Compile the control and macOS optimized variant
      shell: bash
      run: "set -euo pipefail\nexport CCACHE_DIR=\"$RUNNER_TEMP/macos-subsecond-ccache\"\
        \nfor dependency in boost libevent ccache; do\n  if ! brew list --versions\
        \ \"$dependency\" >/dev/null 2>&1 || [[ -z \"$(brew list --versions \"$dependency\"\
        )\" ]]; then\n    HOMEBREW_NO_AUTO_UPDATE=1 brew install \"$dependency\"\n\
        \  fi\ndone\nworkspace=\"$RUNNER_TEMP/macos-subsecond\"\nbuild=\"$workspace/build\"\
        \nmkdir -p \"$workspace\"/{reference,release,candidate}\ncmake -S source -B\
        \ \"$build\" -G Ninja -DCMAKE_BUILD_TYPE=Release \"-DCMAKE_CXX_FLAGS=-Werror=thread-safety\"\
        \   \"-DCMAKE_PREFIX_PATH=$(brew --prefix boost);$(brew --prefix libevent)\"\
        \   -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON\
        \   -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DENABLE_WALLET=ON -DENABLE_IPC=OFF\
        \ -DWITH_USDT=OFF\njobs=\"$(sysctl -n hw.logicalcpu)\"\nfor variant in release\
        \ candidate; do\n  git -C source apply \"$GITHUB_WORKSPACE/$variant.patch\"\
        \n  git -C source diff --check\n  cmake --build \"$build\" --target bitcoind\
        \ --parallel \"$jobs\"\n  cp \"$build/bin/sugarchaind\" \"$workspace/$variant/sugarchaind\"\
        \n  git -C source apply --reverse \"$GITHUB_WORKSPACE/$variant.patch\"\n \
        \ git -C source diff --exit-code\ndone\ngit -C source apply \"$GITHUB_WORKSPACE/candidate.patch\"\
        \nshasum -a 256 \"$workspace/\"{release,candidate}/sugarchaind\n\nmkdir \"\
        $workspace/profile\"\ngit -C source apply \"$GITHUB_WORKSPACE/timing.patch\"\
        \ncmake --build \"$build\" --target bitcoind --parallel \"$jobs\"\ncp \"$build/bin/sugarchaind\"\
        \ \"$workspace/profile/sugarchaind\"\ngit -C source apply --reverse \"$GITHUB_WORKSPACE/timing.patch\"\
        \n"
    - name: Measure fresh receivers with the same 10,000 blocks
      shell: bash
      run: "set -euo pipefail\nworkspace=\"$RUNNER_TEMP/macos-subsecond\"\nfor control\
        \ in release; do\n  for sender in baseline candidate; do\n    python3 regtest-sync.py\
        \ --baseline-bin-dir \"$workspace/$control\" --candidate-bin-dir \"$workspace/candidate\"\
        \       --work-dir \"$workspace/$control-$sender\" --sender \"$sender\" --blocks\
        \ 10000 --repeats 3\n    jq -e '.fixture_sha256 == \"e9a32c1f46099faa4a901e1479aef2aab0bc13f1143d048d3d661564fc0ad2d9\"\
        \n      and .fixture_utxo_sha256 == \"63208d710cf03c30de2660b77a5434181b20fd1c5e70460b256ea4f4e798cb84\"\
        \n      and all(.variants[].samples[]; .reload_verified)' \"$workspace/$control-$sender/result.json\"\
        \n  done\ndone\n\npython3 regtest-sync.py --baseline-bin-dir \"$workspace/candidate\"\
        \ --candidate-bin-dir \"$workspace/profile\" --sender candidate --work-dir\
        \ \"$workspace/profiled\" --blocks 10000 --repeats 1\nfor logfile in \"$workspace/profiled\"\
        /{sender,candidate-1}/regtest/debug.log; do\n  name=$(basename \"$(dirname\
        \ \"$(dirname \"$logfile\")\")\")\n  awk '/STAGEPROFILE|NATIVEFILE|NETPROFILE/{print}'\
        \ \"$logfile\" > \"$workspace/profiled/$name-profile.txt\"\ndone\n"
    - name: Retain comparison evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: intel-sync-comparison
        path: '${{ runner.temp }}/macos-subsecond/*/result.json

          ${{ runner.temp }}/macos-subsecond/profiled/*-profile.txt'
        if-no-files-found: warn
        retention-days: 7
    - name: Check fee estimation, scheduler and chain storage
      run: 'set -euo pipefail

        build="$RUNNER_TEMP/macos-subsecond/build"

        cmake -S source -B "$build" -DBUILD_TESTS=ON

        cmake --build "$build" --target test_bitcoin --parallel "$(sysctl -n hw.logicalcpu)"

        ctest --test-dir "$build" --no-tests=error --output-on-failure -R ''^(policyestimator_tests|scheduler_tests|validationinterface_tests|blockmanager_tests|streams_tests|net_tests|disconnected_transactions)$''

        '
    - name: Preserve native regression results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: intel-native-regression-results
        path: ${{ runner.temp }}/macos-subsecond/build/Testing/Temporary/LastTest.log
    - name: Keep compiler cache for follow-up measurements
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/macos-subsecond-ccache
        key: macos-subsecond-${{ matrix.arch }}-${{ github.run_id }}
